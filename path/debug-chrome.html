<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome 3D Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #08090d; 
      color: #f4f5f7; 
      font-family: 'Courier New', monospace; 
      padding: 20px;
      font-size: 14px;
    }
    #debug-canvas {
      width: 100%;
      height: 400px;
      border: 2px solid #4d9fff;
      background: #000;
      margin: 20px 0;
    }
    .log {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .log-entry.error { color: #ff6b6b; }
    .log-entry.success { color: #34d399; }
    .log-entry.warn { color: #f5c453; }
    .log-entry.info { color: #4d9fff; }
    button {
      background: linear-gradient(135deg, #4d9fff, #b06bff);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 100px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }
    h2 {
      color: #4dd9ff;
      margin-bottom: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>🔍 Chrome 3D Debug Console</h1>
  
  <div class="test-section">
    <h2>Browser Info</h2>
    <div id="browser-info"></div>
  </div>

  <div class="test-section">
    <h2>WebGL Support Test</h2>
    <canvas id="debug-canvas"></canvas>
    <div id="webgl-info"></div>
  </div>

  <div class="test-section">
    <h2>Three.js Import Test</h2>
    <button onclick="testThreeJS()">Test Three.js Import</button>
    <div id="threejs-info"></div>
  </div>

  <div class="test-section">
    <h2>Renderer Creation Test</h2>
    <button onclick="testRenderer()">Test Renderer Creation</button>
    <div id="renderer-info"></div>
  </div>

  <div class="test-section">
    <h2>Material Test</h2>
    <button onclick="testMaterials()">Test Materials</button>
    <div id="material-info"></div>
  </div>

  <div class="test-section">
    <h2>Console Log</h2>
    <div class="log" id="console-log"></div>
  </div>

  <script type="module">
    const logDiv = document.getElementById('console-log');
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    function addLog(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    console.log = function(...args) {
      originalLog.apply(console, args);
      addLog(args.join(' '), 'info');
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      addLog(args.join(' '), 'error');
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLog(args.join(' '), 'warn');
    };

    // Browser info
    const browserInfo = document.getElementById('browser-info');
    browserInfo.innerHTML = `
      <div>User Agent: ${navigator.userAgent}</div>
      <div>Platform: ${navigator.platform}</div>
      <div>WebGL: ${!!document.createElement('canvas').getContext('webgl')}</div>
      <div>WebGL2: ${!!document.createElement('canvas').getContext('webgl2')}</div>
    `;

    // Test WebGL
    const canvas = document.getElementById('debug-canvas');
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    const webglInfo = document.getElementById('webgl-info');
    
    if (gl) {
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Unknown';
      const vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'Unknown';
      
      webglInfo.innerHTML = `
        <div class="log-entry success">✅ WebGL Context Created</div>
        <div class="log-entry info">Version: ${gl instanceof WebGL2RenderingContext ? 'WebGL 2.0' : 'WebGL 1.0'}</div>
        <div class="log-entry info">Renderer: ${renderer}</div>
        <div class="log-entry info">Vendor: ${vendor}</div>
      `;
      console.log('✅ WebGL context created successfully');
    } else {
      webglInfo.innerHTML = `<div class="log-entry error">❌ WebGL not supported</div>`;
      console.error('❌ WebGL not supported');
    }

    // Test Three.js
    window.testThreeJS = async function() {
      const info = document.getElementById('threejs-info');
      try {
        console.log('📦 Importing Three.js...');
        const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js');
        console.log('✅ Three.js imported successfully');
        console.log('  Version:', THREE.REVISION);
        info.innerHTML = `
          <div class="log-entry success">✅ Three.js imported</div>
          <div class="log-entry info">Version: ${THREE.REVISION}</div>
          <div class="log-entry info">WebGLRenderer: ${typeof THREE.WebGLRenderer}</div>
        `;
      } catch (err) {
        console.error('❌ Failed to import Three.js:', err);
        info.innerHTML = `<div class="log-entry error">❌ Import failed: ${err.message}</div>`;
      }
    };

    // Test Renderer
    window.testRenderer = async function() {
      const info = document.getElementById('renderer-info');
      try {
        console.log('🎨 Testing renderer creation...');
        const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js');
        
        const testCanvas = document.createElement('canvas');
        const renderer = new THREE.WebGLRenderer({ 
          canvas: testCanvas,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        
        console.log('✅ Renderer created successfully');
        console.log('  Info:', renderer.info.render);
        
        const isWebGL2 = renderer.capabilities.isWebGL2;
        console.log('  WebGL2:', isWebGL2);
        
        renderer.setSize(800, 400);
        renderer.setClearColor(0x08090d, 1);
        
        info.innerHTML = `
          <div class="log-entry success">✅ Renderer created</div>
          <div class="log-entry info">WebGL2: ${isWebGL2}</div>
          <div class="log-entry info">Size: 800x400</div>
        `;
        
        renderer.dispose();
      } catch (err) {
        console.error('❌ Renderer creation failed:', err);
        info.innerHTML = `<div class="log-entry error">❌ Failed: ${err.message}</div>`;
      }
    };

    // Test Materials
    window.testMaterials = async function() {
      const info = document.getElementById('material-info');
      try {
        console.log('🎨 Testing materials...');
        const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js');
        
        // Test MeshPhysicalMaterial (used in the project)
        const mat = new THREE.MeshPhysicalMaterial({
          color: 0xe8ecef,
          metalness: 0.85,
          roughness: 0.18,
          clearcoat: 0.8,
          clearcoatRoughness: 0.15
        });
        
        console.log('✅ MeshPhysicalMaterial created');
        
        // Test with transmission (problematic in some browsers)
        const glassMat = new THREE.MeshPhysicalMaterial({
          color: 0xbfe9ff,
          transmission: 0.6,
          thickness: 0.4,
          transparent: true
        });
        
        console.log('✅ Glass material with transmission created');
        
        info.innerHTML = `
          <div class="log-entry success">✅ All materials created</div>
          <div class="log-entry info">MeshPhysicalMaterial: OK</div>
          <div class="log-entry info">Transmission support: OK</div>
        `;
      } catch (err) {
        console.error('❌ Material creation failed:', err);
        info.innerHTML = `<div class="log-entry error">❌ Failed: ${err.message}</div>`;
      }
    };

    console.log('🚀 Debug console initialized');
    console.log('Click buttons above to run tests');
  </script>
</body>
</html>
